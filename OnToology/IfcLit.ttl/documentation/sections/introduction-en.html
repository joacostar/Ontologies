<span class="markdown">
Plain ifcOWL is a direct mapping of the IFC schema, and it is inefficient to work with. Earlier simplifications (IfcWoD and SimpleBIM) addressed the problem, but their ontologies and code are not available. ifcLit applies the same ideas in an openly available form.</span>
